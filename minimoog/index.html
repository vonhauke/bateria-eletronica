<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Clone do Minimoog</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
/* Layout: como no aparelho. Painel escuro em moldura de madeira (Controllers, Oscillator Bank, Mixer, Modifiers, Output),
   faixa de madeira com a plaqueta e, embaixo, o painel esquerdo (LFO, Glide, Decay e as rodas) ao lado do teclado de 44 teclas. */
:root{
  --page:#17181a; --ink:#e4e6e8; --muted:#a3a9af;
  --wood-hi:#c8864a; --wood:#a9692f; --wood-lo:#7d4a1f; --wood-edge:#4a2a10;
  --panel:#303337; --panel-hi:#3b3f44; --panel-lo:#25272a; --line:#d8d9d4; --line-dim:#55595e;
  --label:#f1efe8; --sub:#c2c5bd; --tick:#d8d9d4;
  --slot:#0d0e0d;
  --knob:#17181a; --knob-hi:#34373b; --knob-edge:#050505; --mark:#f4f2ea;
  --orange:#e5651b; --teal:#6fc3c8; --cream:#efede4;
  --led:#ff4433; --led-off:#4a1a15; --focus:#ffcf4a;
  --key-w:#f6f4ee; --key-w-down:#cfd1c9; --key-b:#17181a; --key-b-down:#4d514c; --key-edge:#8f928c;
  --font-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mark:"Michroma","Eurostile","Arial Black",Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 70% at 50% 0%,#33363a 0%,var(--page) 60%,#0f1011 100%) fixed var(--page)}
.wrap{max-width:1560px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header p{margin:0 0 1.5rem;max-width:64ch;color:var(--muted)}
button{touch-action:manipulation}

.audio-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:100;display:block;margin:0;padding:.9rem 1rem;border-radius:10px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.35);background:var(--orange);color:#241703;font-family:var(--font-label);font-weight:600;font-size:1.05rem;cursor:pointer}
.audio-bar[hidden]{display:none}

/* ---------- gabinete de madeira ---------- */
.machine{border-radius:7px;overflow:hidden;color:var(--label);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.03) 2px 5px,rgba(0,0,0,.04) 5px 9px),
    linear-gradient(180deg,var(--wood-hi),var(--wood) 40%,var(--wood-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(0,0,0,.45),
    0 3px 0 var(--wood-edge), 0 8px 1px #0a0a0a, 0 18px 16px rgba(0,0,0,.5), 0 46px 60px -12px rgba(0,0,0,.7)}
.frame{padding:16px 20px 0}

/* painel escuro */
.panel{display:flex;flex-wrap:wrap;border-radius:3px;border:2px solid #14151a;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 18%,var(--panel-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 rgba(255,255,255,.12)}
.sec{display:flex;flex-direction:column;border-right:1.5px solid var(--line-dim);border-bottom:1.5px solid var(--line-dim);margin-bottom:-1.5px}
.sec:last-child{border-right:0}
.sec h2{order:2;margin:0;padding:8px 8px 10px;text-align:center;font-family:var(--font-label);font-weight:600;font-size:1.3rem;letter-spacing:.22em;text-transform:uppercase;color:var(--label);line-height:1.1}
.sec-body{flex:1;padding:12px 10px 4px;display:flex;flex-direction:column;gap:8px;align-items:center}
.s-ctrl{flex:1 1 190px}.s-osc{flex:2 1 420px}.s-mix{flex:1.2 1 230px}.s-mod{flex:2.2 1 400px}.s-out{flex:.6 1 120px}
.rowc{display:flex;gap:6px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.sub-title{font-family:var(--font-label);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--label);text-align:center;margin:0 0 2px;padding-bottom:2px;border-bottom:1.5px solid var(--line-dim);width:100%}

.ctl{display:flex;flex-direction:column;align-items:center;width:74px}
.ctl-label{order:-1;font-family:var(--font-label);font-weight:600;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;margin-bottom:2px;text-align:center;min-height:1.6em;display:flex;align-items:flex-end;justify-content:center}
.ctl-val{font-family:var(--font-label);font-weight:500;font-size:.72rem;color:var(--sub);font-variant-numeric:tabular-nums;min-height:1.15em;white-space:nowrap;margin-top:1px}

/* knobs pretos com ponteiro claro */
.knob{width:74px;height:74px;cursor:ns-resize;touch-action:none;border-radius:50%;outline:none}
.knob svg{width:100%;height:100%;display:block;overflow:visible}
.k-ticks line{stroke:var(--tick);stroke-width:1.1}
.k-lab{fill:var(--label);font-family:var(--font-label);font-weight:600;font-size:7.5px;text-anchor:middle;dominant-baseline:central}
.k-gly{fill:none;stroke:var(--label);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.k-skirt{fill:var(--knob-edge)}
.k-cap{fill:url(#kcap);stroke:#4a4d52;stroke-width:.8}
.k-mark{stroke:var(--mark);stroke-width:2.4;stroke-linecap:round}
.knob svg{filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.knob:focus-visible{box-shadow:0 0 0 3px var(--focus)}

/* chaves de balancim: laranja e azul-petróleo no painel, creme no painel do LFO */
.rk{display:flex;flex-direction:column;align-items:center;gap:3px;width:84px}
.rk .ctl-label{min-height:1.6em;margin:0}
.rocker{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px;cursor:pointer;color:var(--label);font-family:var(--font-label);font-weight:600;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase}
.rocker .cap{position:relative;width:36px;height:20px;border-radius:3px;background:var(--rk,var(--orange));box-shadow:0 0 0 2px #0b0b0b, 0 3px 3px rgba(0,0,0,.55);transition:filter .08s}
.rocker .cap::after{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.35))}
.rocker[aria-pressed="false"] .cap{filter:brightness(.5) saturate(.8)}
.rocker[aria-pressed="false"] .cap::after{background:linear-gradient(0deg,rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.45))}
.rocker:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.rocker.teal{--rk:var(--teal)}
.rocker.cream{--rk:var(--cream)}

/* chave de duas posições (radio): fenda e cursor, como nos outros clones */
.sw-wrap{display:flex;flex-direction:column;align-items:flex-start}
.sw-wrap .ctl-label{text-align:left;padding-left:2px;min-height:0;margin-bottom:4px}
.sw{display:flex;flex-direction:column}
.sw button{position:relative;display:flex;align-items:center;gap:7px;background:transparent;border:0;color:var(--sub);font-family:var(--font-label);font-weight:600;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;
  padding:0 5px 0 0;min-height:22px;cursor:pointer;white-space:nowrap;line-height:1.1}
.sw button::before{content:"";align-self:stretch;width:14px;flex:none;background:var(--slot);box-shadow:inset 2px 0 2px #000, 1px 0 0 rgba(255,255,255,.15)}
.sw button:first-child::before{border-radius:3px 3px 0 0}
.sw button:last-child::before{border-radius:0 0 3px 3px}
.sw button[aria-checked="true"]{color:var(--label)}
.sw button[aria-checked="true"]::before{
  background:linear-gradient(180deg,transparent 0 3px,#8b8e88 3px 4px,#56595a 4px 8px,#d9dad4 8px 10px,#56595a 10px calc(100% - 4px),#2a2c2a calc(100% - 4px) calc(100% - 3px),transparent calc(100% - 3px)) var(--slot)}
.sw button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* oscillator bank */
.osc-grid{display:grid;grid-template-columns:auto auto auto auto 90px;gap:6px 4px;align-items:start}
.osc-name{align-self:center;font-family:var(--font-label);font-weight:700;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;width:84px;text-align:right;padding-right:10px}
.osc-grid .gap{width:74px}
.osc-grid .rk{align-self:center}

/* mixer */
.mix-row{display:flex;align-items:center;gap:2px}
.ovl{display:flex;align-items:center;gap:7px;font-family:var(--font-label);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.ovl i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#a8554a,var(--led-off) 55%,#2a0906);box-shadow:0 0 0 1.5px #0b0b0b}
.ovl.on i{background:radial-gradient(circle at 38% 30%,#fff,#ffb09c 22%,var(--led) 58%,#a81d0c);box-shadow:0 0 0 1.5px #0b0b0b,0 0 8px 3px var(--led),0 0 18px 5px rgba(255,70,40,.4)}

/* modifiers */
.mod-wrap{display:flex;gap:10px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.mod-rk{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.mod-knobs{display:flex;flex-direction:column;gap:8px}

/* output */
.pwr{display:flex;align-items:center;gap:8px}
.led{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#a8554a,var(--led-off) 55%,#2a0906);box-shadow:0 0 0 1.5px #0b0b0b;transition:box-shadow .1s}
.led.on{background:radial-gradient(circle at 38% 30%,#fff,#ffb09c 22%,var(--led) 58%,#a81d0c);box-shadow:0 0 0 1.5px #0b0b0b,0 0 8px 3px var(--led),0 0 18px 5px rgba(255,70,40,.4)}

/* faixa de madeira com a plaqueta */
.strip{display:flex;align-items:center;justify-content:flex-end;height:78px;padding:0 6%}
.plate{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 18px 8px;border-radius:3px;background:linear-gradient(180deg,#2a2c30,#17181a);box-shadow:0 0 0 2px #0b0b0b, 0 3px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14)}
.plate b{font-family:var(--font-mark);font-weight:400;font-size:1.5rem;letter-spacing:.04em;color:var(--label);line-height:1}
.plate span{font-family:var(--font-label);font-weight:600;font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--sub);padding-left:.34em}

/* painel esquerdo e teclado */
.bottom{display:flex;align-items:stretch;padding:0 20px 18px;gap:0}
.side{flex:none;display:flex;flex-direction:column;gap:12px;padding:14px 16px;border-radius:3px 0 0 3px;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 18%,var(--panel-lo));border:2px solid #14151a;border-right:0}
.side .btns{display:flex;gap:6px;justify-content:center}
.side .wheels{display:flex;gap:18px;justify-content:center;align-items:flex-start}
.wh{display:flex;flex-direction:column;align-items:center;gap:6px}
.wheel{position:relative;width:32px;height:118px;border-radius:5px;background:var(--slot);touch-action:none;cursor:ns-resize;outline:none;box-shadow:inset 0 2px 4px #000, 0 1px 0 rgba(255,255,255,.18)}
.wheel .w-cap{position:absolute;left:2px;right:2px;height:36px;bottom:calc(var(--p) * (100% - 36px));border-radius:4px;
  background:repeating-linear-gradient(180deg,#e2e2dc 0 2px,#8d8f8a 2px 4px);box-shadow:0 0 0 1px #0b0b0b, 0 3px 4px rgba(0,0,0,.6)}
.wheel.spring .w-cap{transition:bottom .14s ease-out}
.wheel.drag .w-cap{transition:none}
.wheel:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.wh-label{font-family:var(--font-label);font-weight:600;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.kb-wrap{flex:1;min-width:0;overflow-x:auto;padding:14px 12px 14px;background:#1a1b1d;border:2px solid #14151a;border-radius:0 3px 3px 0;display:flex}
.kb{position:relative;display:flex;flex:1;min-height:200px;min-width:760px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;box-shadow:0 6px 8px rgba(0,0,0,.45)}
.key{cursor:pointer}
.key.w{flex:1;background:linear-gradient(180deg,#e2e1da,var(--key-w) 12%,var(--key-w) 88%,#dcdbd4);border:1px solid var(--key-edge);border-top:0;border-radius:0 0 4px 4px;margin-right:-1px}
.key.b{position:absolute;top:0;height:62%;background:linear-gradient(90deg,#000,var(--key-b) 20%,#2c2e2c 50%,var(--key-b) 80%,#000);border-radius:0 0 3px 3px;z-index:2;box-shadow:0 3px 4px rgba(0,0,0,.5), inset 0 -6px 0 #000}
.key.w.down{background:var(--key-w-down)}
.key.b.down{background:var(--key-b-down)}
.kb-nav{display:none;gap:8px;justify-content:space-between;padding:0 20px 14px}
.kb-nav button{font-family:var(--font-label);font-weight:600;font-size:.95rem;background:#2c2e2b;color:var(--label);border:1px solid #6d716c;border-radius:5px;padding:.4rem .8rem;cursor:pointer}
@media (pointer:coarse){.kb-nav{display:flex}}

.help{max-width:72ch;margin-top:2.6rem;color:var(--muted);font-size:.95rem}
.help p{margin:.4rem 0}
kbd{font-family:var(--font-label);font-size:.9em;padding:0 .3em;border:1px solid currentColor;border-radius:3px}

/* ---------- sequenciador: caixa separada, como no Juno-106 ---------- */
.accessory{margin-top:26px;color:var(--label);border-radius:7px;padding:16px 18px 14px;border:2px solid #14151a;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel) 18%,var(--panel-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 3px 0 #111, 0 14px 16px rgba(0,0,0,.5)}
.acc-head h2{font-family:var(--font-label);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;margin:0;line-height:1.2;display:inline-block;background:var(--orange);color:#17181a;padding:2px 10px}
.acc-ctl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 28px;margin-top:12px}
.acc-ctl .ctl-label{order:0;margin:6px 0 0;min-height:0;justify-content:flex-start;text-align:left}
.acc-ctl .ctl .ctl-label{order:-1;margin:0 0 2px;min-height:1.6em;justify-content:center;text-align:center}
.sbtn{font-family:var(--font-label);font-weight:700;font-size:.88rem;letter-spacing:.05em;text-transform:uppercase;color:#17181a;border:0;border-radius:3px;padding:.42rem .8rem .5rem;cursor:pointer;
  background:linear-gradient(180deg,#fbf9ef,var(--cream) 45%,#b9b6a9);
  box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 4px 3px 1px rgba(0,0,0,.45)}
.sbtn:active{transform:translateY(1px)}
.sbtn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.sbtn.big{font-size:1.05rem;min-width:96px;padding:.8rem 1.4rem .9rem;background:linear-gradient(180deg,#ffb468,var(--orange) 45%,#b34710)}
.sbtn.big[aria-pressed="true"]{box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b, 0 0 10px 3px rgba(229,101,27,.7)}
.btn-row{display:flex;gap:10px}
.slots{display:flex;gap:6px}
.slots button{width:34px;height:28px;padding:0 0 2px;font-family:var(--font-label);font-weight:700;font-size:.95rem;color:#17181a;border:0;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#fbf9ef,var(--cream) 45%,#b9b6a9);box-shadow:inset 0 1px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 2px #0b0b0b}
.slots button[aria-checked="true"]{background:linear-gradient(180deg,#ffb468,var(--orange) 45%,#b34710)}
.slots button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.oct-row{display:flex;align-items:center;gap:8px}
.oct-val{font-family:var(--font-label);font-weight:600;min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.seq-scroll{overflow-x:auto;margin-top:14px;padding-bottom:6px}
.seqgrid{display:grid;grid-template-columns:44px repeat(16,minmax(26px,1fr));gap:2px;min-width:620px;user-select:none;-webkit-user-select:none}
.sl{font-family:var(--font-label);font-size:.78rem;color:var(--sub);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;line-height:1}
.sl.c{color:var(--label);font-weight:700}
.sh{font-family:var(--font-label);font-size:.82rem;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.sh.now{color:var(--led);font-weight:700}
.sh.hid{text-decoration:underline dotted}
.sc{appearance:none;border:0;border-radius:2px;height:13px;padding:0;background:#5a5d62;cursor:pointer;box-shadow:inset 0 1px 1px rgba(0,0,0,.4)}
.sc.blk{background:#3d4044}
.sc.beat,.sh.beat{margin-left:3px}
.sc.on{background:var(--orange);box-shadow:0 0 6px rgba(229,101,27,.6)}
.sc.now{background-image:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22))}
.sc.off,.sh.off{opacity:.3}
.sc:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media (pointer:coarse){.sbtn{min-height:44px}.slots button{width:38px;height:34px}}

@media (max-width:1000px){
  .sec{flex:1 1 100%;border-right:0}
  .sec-body{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .strip{justify-content:center;height:68px}
}
@media (max-width:860px){
  .bottom{flex-direction:column;padding:0 12px 14px}
  .frame{padding:12px 12px 0}
  .side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;border-right:2px solid #14151a;border-radius:3px 3px 0 0;gap:14px 22px}
  .kb-wrap{border-radius:0 0 3px 3px}
  .kb{min-height:170px}
}
@media (prefers-reduced-motion:reduce){.wheel.spring .w-cap{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="sr">Minimoog</h1>
  </header>
  <button type="button" class="audio-bar" id="audio-bar" hidden>Som desligado. Toque aqui para ativar.</button>

  <section class="machine" aria-label="Sintetizador">
    <div class="frame">
      <div class="panel">
        <section class="sec s-ctrl" aria-label="Controllers"><div class="sec-body" id="s-ctrl"></div><h2>Controllers</h2></section>
        <section class="sec s-osc" aria-label="Oscillator bank"><div class="sec-body" id="s-osc"></div><h2>Oscillator Bank</h2></section>
        <section class="sec s-mix" aria-label="Mixer"><div class="sec-body" id="s-mix"></div><h2>Mixer</h2></section>
        <section class="sec s-mod" aria-label="Modifiers"><div class="sec-body" id="s-mod"></div><h2>Modifiers</h2></section>
        <section class="sec s-out" aria-label="Output"><div class="sec-body" id="s-out"></div><h2>Output</h2></section>
      </div>
    </div>
    <div class="strip"><div class="plate" aria-hidden="true"><b>minimoog</b><span>Model D</span></div></div>
    <div class="bottom">
      <div class="side">
        <div class="rowc" id="c-lfo"></div>
        <div class="btns" id="c-btns"></div>
        <div class="wheels" id="c-wheels"></div>
      </div>
      <div class="kb-wrap">
        <div class="kb" id="kb" role="group" aria-label="Teclado de 44 teclas"></div>
      </div>
    </div>
    <div class="kb-nav"><button type="button" id="kb-left" aria-label="Rolar o teclado para os graves">&larr; Graves</button><button type="button" id="kb-right" aria-label="Rolar o teclado para os agudos">Agudos &rarr;</button></div>
  </section>

  <section class="accessory" aria-label="Sequenciador">
    <div class="acc-head"><h2>Sequenciador</h2></div>
    <div class="acc-ctl">
      <button type="button" class="sbtn big" id="seq-play" aria-pressed="false">Tocar</button>
      <div class="rowc" id="seq-knobs"></div>
      <div class="sw-wrap"><div class="slots" id="seq-len" role="radiogroup" aria-label="Número de passos"></div><div class="ctl-label">Passos</div></div>
      <div class="sw-wrap">
        <div class="oct-row">
          <button type="button" class="sbtn" id="seq-tr-down" aria-label="Transpor a sequência uma oitava abaixo">Oitava −</button>
          <span class="oct-val" id="seq-tr" aria-live="polite"></span>
          <button type="button" class="sbtn" id="seq-tr-up" aria-label="Transpor a sequência uma oitava acima">Oitava +</button>
        </div>
        <div class="ctl-label">Transpor a sequência</div>
      </div>
      <div class="sw-wrap">
        <div class="oct-row">

function exampleSteps(){ return [36,null,48,36,null,39,null,43,41,null,53,41,null,43,46,null]; }

/* ---------- motor de áudio ---------- */
let ctx = null, V = null;

function curve(fn, n = 2048){

}

  p => 2 * p - 1,                                 // dente de serra

function ensureAudio(){

  if (!V) return;

function applyV(id){
  if (!V) return;

    case 'tune': case 'f2': case 'f3': applyDetune(); break;
    case 'glide': break;
    case 'modMix': case 'modWheel': applyMod(); break;
    case 'lfoRate': smooth(V.lfo.frequency, lfoHz(v)); break;
    case 'r1': case 'r2': case 'r3': if (curNote !== null) setPitch(curNote, ctx.currentTime, false); break;
    case 'w1': case 'w2': case 'w3': V.osc[+id[1] - 1].setPeriodicWave(V.waves[idx(id)]); break;

function applyT(id){
  if (!V) return;

    case 'osc3k': case 'kb1': case 'kb2': if (curNote !== null) setPitch(curNote, ctx.currentTime, false); break;
    case 'oscMod': case 'filtMod': applyMod(); break;
    case 'on1': case 'on2': case 'on3': case 'onN': applyLevels(); break;

/* ---------- voz ---------- */
let curNote = null;

function setPitch(note, t, glide){
  const o3 = st.t.osc3k ? note : 60;

    p.setTargetAtTime(1, t, Math.max(at / 3, 0.0005));

  }
}

/* ---------- lógica de teclado: monofônico, última nota tem prioridade, legato não redispara ---------- */
const phys = new Map();   // tecla física → nota
const stack = [];         // notas seguradas, a última tem prioridade
const keyEls = {};
let held = false;         // Hold: a nota segue soando depois de soltar a tecla, até outra ser tocada
const keyActive = () => stack.length > 0 || held;

function keyDown(key){
  ensureAudio();
  if (phys.has(key)) return;
  phys.set(key, key); markKey(key, true);
  const now = ctx.currentTime + 0.005, legato = keyActive();
  held = false;
  stack.push(key);
  setPitch(key, now, true);
  if (!legato) envOn(now);
}
function keyUp(key){
  if (!phys.has(key)) return;
  phys.delete(key); markKey(key, false);
  if (!ctx) return;
  const now = ctx.currentTime + 0.005;
  const i = stack.lastIndexOf(key), wasTop = i === stack.length - 1;
  if (i >= 0) stack.splice(i, 1);
  if (st.t.hold) { if (!stack.length) held = true; return; }
  if (stack.length) { if (wasTop) setPitch(stack[stack.length - 1], now, true); }
  else envOff(now);

/* ---------- controles genéricos ---------- */
function attachDrag(el, get, set, keyStep){
  let sv = 0, sp = 0, active = null;

    if (e.button !== 0) return;
    el.setPointerCapture(e.pointerId); active = e.pointerId; sv = get(); sp = e.clientY;
    el.focus({preventScroll:true}); e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === active) set(sv + (sp - e.clientY) / (e.shiftKey ? 600 : 140)); });
  const end = e => { if (e.pointerId === active) active = null; };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => { e.preventDefault(); set(get() - Math.sign(e.deltaY) * (keyStep || (e.shiftKey ? .005 : .02))); }, {passive:false});
  el.addEventListener('keydown', e => {
    const s = keyStep || (e.shiftKey ? .002 : .01), v = get();
    const map = {ArrowUp:v+s, ArrowRight:v+s, ArrowDown:v-s, ArrowLeft:v-s, PageUp:v+(keyStep || .1), PageDown:v-(keyStep || .1), Home:0, End:1};
    if (e.key in map) { e.preventDefault(); e.stopPropagation(); set(map[e.key]); }
  });

    const a = (-135 + 270 * i / (scale.length - 1)) * Math.PI / 180, x = 42 + Math.sin(a) * 35.5, y = 42 - Math.cos(a) * 35.5;
    labs += t.startsWith('#') ? `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(.62)"><path class="k-gly" d="${GLYPH[t.slice(1)]}"/></g>`
                              : `<text class="k-lab" x="${x.toFixed(2)}" y="${y.toFixed(2)}">${t}</text>`;
  });
  const gid = 'kc' + (knobUid++);
  el.innerHTML = `<svg viewBox="0 0 84 84" aria-hidden="true"><defs><radialGradient id="${gid}" cx=".38" cy=".3" r=".9"><stop offset="0" stop-color="#4a4d52"/><stop offset=".55" stop-color="#1c1d1f"/><stop offset="1" stop-color="#0b0b0c"/></radialGradient></defs><g class="k-ticks">${ticks}</g>${labs}<circle class="k-skirt" cx="42" cy="42" r="23"/><g class="k-rot"><circle cx="42" cy="42" r="18" fill="url(#${gid})" stroke="#4a4d52" stroke-width=".8"/><line class="k-mark" x1="42" y1="38" x2="42" y2="26"/></g></svg>`;
  const lab = document.createElement('div'); lab.className = 'ctl-label'; lab.textContent = label;
  const out = document.createElement('div'); out.className = 'ctl-val';
  wrap.append(el, lab, out); parent.append(wrap);
  const rot = el.querySelector('.k-rot');
  const render = () => {
    const v = st.v[id], txt = steps ? (o.names ? o.names[idx(id)] : fmt(v)) : fmt(v);
    rot.setAttribute('transform', `rotate(${(-135 + 270 * v).toFixed(1)} 42 42)`);
    out.textContent = txt;
    el.setAttribute('aria-valuenow', Math.round(v * 100)); el.setAttribute('aria-valuetext', txt);
  };
  const set = v => {
    v = Math.min(1, Math.max(0, v));
    if (steps) v = Math.round(v * (steps - 1)) / (steps - 1);
    if (v === st.v[id]) return;
    st.v[id] = v; render(); applyV(id); updateOverload(); save();
  };
  renders.push(render);
  attachDrag(el, () => st.v[id], set, steps ? 1 / (steps - 1) : 0);
  el.addEventListener('dblclick', () => set(DEF[id]));
  render();
  return wrap;
}

function makeRocker(parent, id, label, cls = '', text = 'On'){
  const wrap = document.createElement('div'); wrap.className = 'rk';

}

let bendVal = 0;
function setBend(v){
  bendVal = Math.max(-1, Math.min(1, v));

  if (V) V.bend.offset.setTargetAtTime(bendVal, ctx.currentTime, 0.01);
}
function setMod(v){
  v = Math.max(0, Math.min(1, v));
  st.v.modWheel = v;
  modEl.style.setProperty('--p', v); modEl.setAttribute('aria-valuenow', Math.round(v * 100));
  applyMod(); save();
}
function makeWheel(parent, label, aria, spring, onValue, onEnd, step){
  const wh = div('wh', parent);
  const el = div('wheel' + (spring ? ' spring' : ''), wh);
  el.tabIndex = 0; el.setAttribute('role', 'slider'); el.setAttribute('aria-label', aria);
  el.setAttribute('aria-valuemin', spring ? '-100' : '0'); el.setAttribute('aria-valuemax', '100');
  el.innerHTML = '<div class="w-cap"></div>';
  const lab = div('wh-label', wh); lab.textContent = label;
  let active = null;
  const frac = e => { const r = el.getBoundingClientRect(); return 1 - Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); };
  el.addEventListener('pointerdown', e => {
    ensureAudio(); el.setPointerCapture(e.pointerId); active = e.pointerId; el.classList.add('drag'); onValue(frac(e)); e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === active) onValue(frac(e)); });
  const end = e => { if (e.pointerId !== active) return; active = null; el.classList.remove('drag'); if (onEnd) onEnd(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => {
    const d = {ArrowUp:1, ArrowRight:1, ArrowDown:-1, ArrowLeft:-1}[e.key]; if (!d) return;
    e.preventDefault(); e.stopPropagation(); ensureAudio(); step(d);
  });
  if (spring) el.addEventListener('keyup', e => { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key) && onEnd) onEnd(); });
  return el;
}

/* ---------- sequenciador (uma nota por passo; a tecla segurada tem prioridade) ---------- */
const SEQ_ROWS = 25;
const seqBpm = () => Math.round(50 + st.v.seqTempo * 150);
const seqStepDur = () => 60 / seqBpm() / 4;
const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
let seqPlaying = false, seqNext = 0, seqIdx = 0, seqNow = -1, seqClock = null;
const seqQueue = [];

function seqNote(note, t, off){
  setPitch(note, t, true); envOn(t); envOff(off);
}
function seqStep(i, t){
  const n = st.seq.steps[i];
  if (n === null || keyActive()) return;                // passo vazio, ou tecla segurada: a tecla manda
  const note = Math.max(12, Math.min(120, n + 12 * st.seq.oct));
  seqNote(note, t, t + seqStepDur() * (0.1 + st.v.seqGate * 0.9));
}
function seqTick(){
  if (!ctx || !seqPlaying) return;
  const now = ctx.currentTime;
  if (seqNext < now - 0.2) seqNext = now + 0.02;          // aba ficou em segundo plano
  while (seqNext < now + 0.12) {
    seqIdx %= st.seq.len;
    seqStep(seqIdx, seqNext); seqQueue.push({i:seqIdx, t:seqNext});
    seqNext += seqStepDur(); seqIdx = (seqIdx + 1) % st.seq.len;
  }
}
const startSeqClock = () => { if (!seqClock) seqClock = setInterval(seqTick, 25); };
const playBtn = $('seq-play');
function renderPlay(){ playBtn.setAttribute('aria-pressed', seqPlaying); playBtn.textContent = seqPlaying ? 'Parar' : 'Tocar'; }
function seqPlay(){
  ensureAudio(); startSeqClock();
  if (seqPlaying) return;
  seqPlaying = true; seqIdx = 0; seqQueue.length = 0; seqNext = ctx.currentTime + 0.06;
  seqTick(); requestAnimationFrame(seqDraw); renderPlay();
}
function seqStop(){
  if (!seqPlaying) return;
  seqPlaying = false; seqQueue.length = 0;
  if (ctx && !keyActive()) envOff(ctx.currentTime);      // corta o que já estava agendado
  setSeqNow(-1); renderPlay();
}
function seqDraw(){
  if (!seqPlaying) return;
  const now = ctx.currentTime; let cur = null;
  while (seqQueue.length && seqQueue[0].t <= now) cur = seqQueue.shift().i;
  if (cur !== null) setSeqNow(cur);
  requestAnimationFrame(seqDraw);
}
function seqPreview(note){
  ensureAudio();
  if (keyActive()) return;
  const t = ctx.currentTime + 0.01;
  seqNote(note, t, t + 0.28);
}
playBtn.addEventListener('click', () => seqPlaying ? seqStop() : seqPlay());
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat && (e.target === document.body || e.target === document.documentElement)) {
    e.preventDefault(); seqPlaying ? seqStop() : seqPlay();
  }
});

/* grade de notas */
const seqEl = $('seqgrid');
const seqCells = [], seqHeads = [];
function seqBuild(){
  seqEl.innerHTML = ''; seqCells.length = 0; seqHeads.length = 0;
  for (let i = 0; i < 16; i++) seqCells.push([]);
  seqEl.append(document.createElement('div'));
  for (let i = 0; i < 16; i++) {
    const h = document.createElement('div'); h.className = 'sh' + (i % 4 === 0 && i ? ' beat' : ''); h.textContent = i + 1;
    seqEl.append(h); seqHeads.push(h);
  }
  for (let r = 0; r < SEQ_ROWS; r++) {
    const note = st.seq.base + SEQ_ROWS - 1 - r, pc = note % 12, blk = [1,3,6,8,10].includes(pc);
    const l = document.createElement('div'); l.className = 'sl' + (pc === 0 ? ' c' : ''); l.textContent = noteName(note); seqEl.append(l);
    for (let i = 0; i < 16; i++) {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'sc' + (blk ? ' blk' : '') + (i % 4 === 0 && i ? ' beat' : '');
      b.dataset.step = i; b.dataset.note = note; b.setAttribute('aria-label', `Passo ${i + 1}, ${noteName(note)}`);
      seqEl.append(b); seqCells[i].push(b);
    }
  }
  seqRender();
  const n = seqNow; seqNow = -1; if (n >= 0) setSeqNow(n);
}
function seqRenderStep(i){
  const off = i >= st.seq.len, n = st.seq.steps[i], lo = st.seq.base, hi = st.seq.base + SEQ_ROWS - 1;
  const hid = n !== null && (n < lo || n > hi);
  seqHeads[i].classList.toggle('off', off);
  seqHeads[i].classList.toggle('hid', hid);
  seqHeads[i].title = hid ? 'A nota deste passo está fora da janela visível' : '';
  for (const b of seqCells[i]) {
    const on = n === +b.dataset.note;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.classList.toggle('off', off);
  }
}
function seqRender(){
  for (let i = 0; i < 16; i++) seqRenderStep(i);
  $('seq-range').textContent = noteName(st.seq.base) + ' a ' + noteName(st.seq.base + SEQ_ROWS - 1);
  renderTr();
  lenEl.querySelectorAll('button').forEach(b => { const on = +b.dataset.n === st.seq.len; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
}
function renderTr(){
  const o = st.seq.oct;
  $('seq-tr').textContent = o === 0 ? 'Original' : (o > 0 ? '+' : '−') + Math.abs(o) + (Math.abs(o) === 1 ? ' oitava' : ' oitavas');
}
function setTranspose(d){
  st.seq.oct = Math.max(-2, Math.min(2, st.seq.oct + d)); renderTr(); save();
  if (!seqPlaying) seqPreview(48 + 12 * st.seq.oct);      // nota de teste: dá para ouvir a oitava
}
$('seq-tr-down').addEventListener('click', () => setTranspose(-1));
$('seq-tr-up').addEventListener('click', () => setTranspose(1));
function setSeqNow(i){
  if (seqNow >= 0) { seqHeads[seqNow].classList.remove('now'); seqCells[seqNow].forEach(c => c.classList.remove('now')); }
  seqNow = i;
  if (i >= 0) { seqHeads[i].classList.add('now'); seqCells[i].forEach(c => c.classList.add('now')); }
}

/* passos, janela, limpar e exemplo */
const lenEl = $('seq-len');
for (const n of [4, 8, 12, 16]) {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.n = n; b.textContent = n;
  b.setAttribute('aria-label', n + ' passos'); lenEl.append(b);

});

/* pintar notas: clique, arrasto (mouse e caneta) e teclado. Um passo tem uma nota: acender outra troca a anterior. */
function seqSet(b, on){
  const i = +b.dataset.step, n = +b.dataset.note, cur = st.seq.steps[i];
  if (on) { if (cur === n) return false; st.seq.steps[i] = n; }
  else { if (cur !== n) return false; st.seq.steps[i] = null; }
  seqRenderStep(i);
  return true;
}
const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); const b = el && el.closest ? el.closest('button.sc') : null; return b && seqEl.contains(b) ? b : null; };
let seqDrag = null, seqSuppress = 0;
seqEl.addEventListener('click', e => {
  const b = e.target.closest('button.sc'); if (!b) return;
  if (e.detail > 0 && performance.now() < seqSuppress) return; // já tratado pelo arrasto
  const on = st.seq.steps[+b.dataset.step] !== +b.dataset.note;
  seqSet(b, on); if (on && !seqPlaying) seqPreview(+b.dataset.note); save();
});
seqEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' || e.button !== 0) return; // no toque, arrastar rola a grade
  const b = e.target.closest('button.sc'); if (!b) return;
  const on = st.seq.steps[+b.dataset.step] !== +b.dataset.note;
  seqDrag = {on, x:e.clientX, y:e.clientY}; seqSuppress = Infinity;
  seqSet(b, on); if (on && !seqPlaying) seqPreview(+b.dataset.note);
});
window.addEventListener('pointermove', e => {
  if (!seqDrag) return;
  if (e.buttons === 0) { endSeqDrag(); return; }
  const dx = e.clientX - seqDrag.x, dy = e.clientY - seqDrag.y, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
  for (let k = 1; k <= n; k++) { const c = cellAt(seqDrag.x + dx * k / n, seqDrag.y + dy * k / n); if (c) seqSet(c, seqDrag.on); }
  seqDrag.x = e.clientX; seqDrag.y = e.clientY;
});
function endSeqDrag(){ if (!seqDrag) return; seqDrag = null; seqSuppress = performance.now() + 400; save(); }
window.addEventListener('pointerup', endSeqDrag);
window.addEventListener('pointercancel', endSeqDrag);
window.addEventListener('blur', endSeqDrag);

makeKnob($('seq-knobs'), 'seqTempo', 'Tempo', {fmt:x => seqBpm() + ' BPM'});
makeKnob($('seq-knobs'), 'seqGate', 'Gate', {fmt:x => Math.round((0.1 + x * 0.9) * 100) + '%'});
seqBuild(); renderPlay();

  kb.append(k); keyEls[m] = k;
});
for (let m = KEY_LO; m <= KEY_HI; m++) {
  if (![1,3,6,8,10].includes(m % 12)) continue;
  const left = whites.indexOf(m + 1) * W;
  const k = document.createElement('div'); k.className = 'key b'; k.dataset.key = m;
  k.setAttribute('aria-label', NAMES[m % 12] + (Math.floor(m / 12) - 1));
  k.style.left = `calc(${left}% - ${W * 0.31}%)`; k.style.width = `${W * 0.62}%`;
  kb.append(k); keyEls[m] = k;
}
function markKey(m, on){ if (keyEls[m]) keyEls[m].classList.toggle('down', on); }

const pointerKey = new Map();
const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest && el.closest('.key') ? +el.closest('.key').dataset.key : null; };
kb.addEventListener('pointerdown', e => {
  const k = keyAt(e.clientX, e.clientY); if (k === null) return;
  kb.setPointerCapture(e.pointerId); pointerKey.set(e.pointerId, k); keyDown(k); e.preventDefault();
});
kb.addEventListener('pointermove', e => {
  if (!pointerKey.has(e.pointerId)) return;
  const k = keyAt(e.clientX, e.clientY), old = pointerKey.get(e.pointerId);
  if (k === null || k === old) return;
  pointerKey.set(e.pointerId, k); keyDown(k); keyUp(old); // nova nota antes de soltar a antiga: legato
});
const kbEnd = e => { if (!pointerKey.has(e.pointerId)) return; keyUp(pointerKey.get(e.pointerId)); pointerKey.delete(e.pointerId); };
kb.addEventListener('pointerup', kbEnd); kb.addEventListener('pointercancel', kbEnd);

/* teclado largo no toque: botões para rolar e início perto do C central */
const kbWrap = kb.parentElement;
const kbScroll = d => kbWrap.scrollBy({left: d * kb.scrollWidth / whites.length * 7, behavior: 'smooth'});
$('kb-left').addEventListener('click', () => kbScroll(-1));
$('kb-right').addEventListener('click', () => kbScroll(1));
if (window.matchMedia('(pointer: coarse)').matches && kbWrap.scrollWidth > kbWrap.clientWidth)
  kbWrap.scrollLeft = Math.max(0, whites.indexOf(60) / whites.length * kb.scrollWidth - kbWrap.clientWidth * 0.3);

/* ---------- teclado do computador ---------- */
const KMAP = {a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12, o:13, l:14, p:15, 'ç':16, ';':16};
let kbBase = 60;
const compHeld = new Map();
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const ch = e.key.toLowerCase();
  if (ch === 'z') { kbBase = Math.max(41, kbBase - 12); return; }
  if (ch === 'x') { kbBase = Math.min(72, kbBase + 12); return; }
  if (!(ch in KMAP) || compHeld.has(ch)) return;
  const m = kbBase + KMAP[ch]; if (m > KEY_HI) return;
  compHeld.set(ch, m); keyDown(m);
});
document.addEventListener('keyup', e => {
  const ch = e.key.toLowerCase();
  if (!compHeld.has(ch)) return;
  keyUp(compHeld.get(ch)); compHeld.delete(ch);
});
window.addEventListener('blur', () => {
  for (const m of compHeld.values()) keyUp(m); compHeld.clear();
  for (const m of pointerKey.values()) keyUp(m); pointerKey.clear();
});
})();
</script>
